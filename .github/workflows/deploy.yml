name: Deploy video-parser to Lighthouse

# 触发条件：推送代码到 master 或 main 分支时自动部署
on:
  push:
    branches: [master, main]
  # 允许手动在 Actions 页面触发（便于调试）
  workflow_dispatch:

jobs:
  deploy:
    name: SSH deploy & restart service
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH ( pull + rebuild + restart)
        uses: appleboy/ssh-action@v1
        with:
          host: 110.40.130.167
          username: root
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true # 任意一步失败立即中止，避免半吊子状态
          script: |
            set -e
            echo "==> [1/4] 拉取最新代码"
            cd /opt/video-parser
            git fetch origin ${{ github.ref_name }}
            git reset --hard FETCH_HEAD

            echo "==> [2/4] 用国内镜像重新构建镜像"
            # /opt/Dockerfile.prod 是服务器本地的「换国内源 + tuna pip」构建文件
            docker build -f /opt/Dockerfile.prod -t video-parser .

            echo "==> [3/4] 停掉旧容器"
            docker stop video-parser || true
            docker rm video-parser || true

            echo "==> [4/4] 启动容器（7868 开机自启，挂载持久化目录）"
            docker run -d \
              --name video-parser \
              --restart unless-stopped \
              -p 7868:7868 \
              --env-file /opt/video-parser/.env \
              -v /opt/video-parser/app/downloads:/app/downloads \
              -v /opt/video-parser/cache:/cache \
              -v /opt/video-parser/logs:/logs \
              video-parser:latest

            echo "==> DEPLOY DONE $(date)"
