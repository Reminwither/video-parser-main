name: Deploy video-parser to Lighthouse

"on":
  push:
    branches: [master, main]
    paths-ignore:
      - 'admin/**'
      - '.github/workflows/deploy-admin.yml'
      - '.github/workflows/health-monitor.yml'
  workflow_dispatch:

concurrency:
  group: lighthouse-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy & restart service
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Transfer Git bundle to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          git bundle create deploy.bundle HEAD
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/video-parser-deploy"
          chmod 600 "$HOME/.ssh/video-parser-deploy"
          printf '%s\n' '110.40.138.167 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJYu1mauq0iI3U/9HflbLGyyd7K+qTNybC1xFOS8r/WH' >> "$HOME/.ssh/known_hosts"
          scp -i "$HOME/.ssh/video-parser-deploy" -o StrictHostKeyChecking=yes deploy.bundle root@110.40.138.167:/opt/video-parser/deploy.bundle

      - name: Deploy over SSH ( pull + rebuild + restart)
        uses: appleboy/ssh-action@v1
        with:
          host: 110.40.138.167
          username: root
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e
            DOMAIN_VALUE=$(sed -n 's/^DOMAIN=//p' /opt/video-parser/.env | tail -n 1)
            DOMAIN_HOST=${DOMAIN_VALUE#https://}
            DOMAIN_HOST=${DOMAIN_HOST#http://}
            DOMAIN_HOST=${DOMAIN_HOST%%/*}
            test -n "$DOMAIN_HOST" || { echo "Set DOMAIN in /opt/video-parser/.env before deploying"; exit 1; }
            grep -Eq '^SESSION_COOKIE_SECURE=(1|true|yes|on)$' /opt/video-parser/.env || { echo "Set SESSION_COOKIE_SECURE=1 after HTTPS is active"; exit 1; }
            curl -fsS "https://$DOMAIN_HOST/health" >/dev/null || { echo "HTTPS reverse proxy is not healthy; refusing to replace the running app"; exit 1; }
            echo "==> [1/4] 导入本次提交"
            cd /opt/video-parser
            git fetch ./deploy.bundle HEAD
            git reset --hard FETCH_HEAD
            rm -f deploy.bundle

            echo "==> [2/4] 用国内镜像重新构建镜像"
            # /opt/Dockerfile.prod 是服务器本地的「换国内源 + tuna pip」构建文件
            docker build -f /opt/Dockerfile.prod -t video-parser:candidate .

            start_container() {
              docker run -d \
                --name video-parser \
                --restart unless-stopped \
                -p 127.0.0.1:7860:7860 \
                --env-file /opt/video-parser/.env \
                -e APP_USER=admin \
                -e REQUIRE_AUTH=1 \
                -e SESSION_COOKIE_SECURE=1 \
                -v /opt/video-parser/static/videos:/app/static/videos \
                -v /opt/video-parser/static/images:/app/static/images \
                -v /opt/video-parser/downloads:/app/downloads \
                -v /opt/video-parser/cache:/app/cache \
                -v /opt/video-parser/logs:/app/logs \
                -v /opt/video-parser/data:/app/data \
                "$1"
            }

            rollback() {
              echo "New release failed; restoring previous image"
              docker logs --tail 60 video-parser 2>/dev/null || true
              docker stop video-parser 2>/dev/null || true
              docker rm video-parser 2>/dev/null || true
              start_container video-parser:latest || true
              exit 1
            }

            echo "==> [3/4] 停掉旧容器"
            docker stop video-parser || true
            docker rm video-parser || true

            echo "==> [4/4] 启动容器（7860 仅本机访问，挂载持久化目录）"
            mkdir -p /opt/video-parser/static/videos /opt/video-parser/static/images
            start_container video-parser:candidate || rollback

            for attempt in 1 2 3 4 5; do
              if curl -fsS http://127.0.0.1:7860/health >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Health check failed"
                rollback
              fi
              sleep 5
            done
            # 访客可浏览主页（200）；账户页与业务 API 必须被拦截（302 / 401）
            CODE_HOME=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7860/)
            if [ "$CODE_HOME" != "200" ]; then
              echo "Homepage not reachable (got $CODE_HOME)"
              rollback
            fi
            CODE_ACCT=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7860/account)
            if [ "$CODE_ACCT" != "302" ]; then
              echo "Account page not protected (got $CODE_ACCT)"
              rollback
            fi
            CODE_API=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7860/api/parse \
              -H 'Content-Type: application/json' -d '{"text":""}')
            if [ "$CODE_API" != "401" ]; then
              echo "Business API not protected (got $CODE_API)"
              rollback
            fi
            curl -fsS "https://$DOMAIN_HOST/health" >/dev/null || rollback
            docker tag video-parser:candidate video-parser:latest
            echo "==> DEPLOY DONE $(date)"
