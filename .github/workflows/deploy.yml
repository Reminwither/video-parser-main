name: Deploy video-parser to Lighthouse

"on":
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    name: SSH deploy & restart service
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH ( pull + rebuild + restart)
        uses: appleboy/ssh-action@v1
        with:
          host: 110.40.138.167
          username: root
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          envs: APP_PASS
          # 通过环境变量传入密码，避免把密码拼进远程 shell 脚本。
          script: |
            set -e
            test -n "$APP_PASS" || { echo "APP_PASS secret is required"; exit 1; }
            echo "==> [1/4] 拉取最新代码"
            cd /opt/video-parser
            for attempt in 1 2 3 4 5; do
              if git fetch origin ${{ github.ref_name }}; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "git fetch failed after 5 attempts"
                exit 1
              fi
              sleep 5
            done
            git reset --hard FETCH_HEAD

            echo "==> [2/4] 用国内镜像重新构建镜像"
            # /opt/Dockerfile.prod 是服务器本地的「换国内源 + tuna pip」构建文件
            docker build -f /opt/Dockerfile.prod -t video-parser .

            echo "==> [3/4] 停掉旧容器"
            docker stop video-parser || true
            docker rm video-parser || true

            echo "==> [4/4] 启动容器（7860 开机自启，挂载持久化目录）"
            docker run -d \
              --name video-parser \
              --restart unless-stopped \
              -p 7860:7860 \
              --env-file /opt/video-parser/.env \
              -e APP_USER=admin \
              -e APP_PASS \
              -e REQUIRE_AUTH=1 \
              -v /opt/video-parser/downloads:/app/downloads \
              -v /opt/video-parser/cache:/app/cache \
              -v /opt/video-parser/logs:/app/logs \
              video-parser:latest

            for attempt in 1 2 3 4 5; do
              if curl -fsS http://127.0.0.1:7860/health >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Health check failed"
                exit 1
              fi
              sleep 5
            done
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7860/)" = "401" || {
              echo "Anonymous access is not blocked"
              exit 1
            }
            echo "==> DEPLOY DONE $(date)"
        env:
          APP_PASS: ${{ secrets.APP_PASS }}
