name: Deploy video-parser admin

"on":
  push:
    branches: [master, main]
    paths:
      - 'admin/**'
      - '.github/workflows/deploy-admin.yml'
      - 'ops/deploy-admin-container.sh'
      - 'ops/validation-requirements.txt'
      - 'test_admin_release.py'
      - 'test_report_metrics.py'
  workflow_dispatch:

concurrency:
  group: lighthouse-server-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Check report metrics before admin release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install -r ops/validation-requirements.txt
      - run: python3 -m unittest test_report_metrics test_admin_release
      - run: bash -n ops/deploy-admin-container.sh
      - run: python3 -m py_compile admin/app.py
  deploy:
    name: SSH deploy admin (7861, loopback only)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Transfer Git bundle to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/video-parser-deploy"
          chmod 600 "$HOME/.ssh/video-parser-deploy"
          printf '%s\n' '110.40.138.167 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJYu1mauq0iI3U/9HflbLGyyd7K+qTNybC1xFOS8r/WH' >> "$HOME/.ssh/known_hosts"
          ssh_options=(-i "$HOME/.ssh/video-parser-deploy" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          bundle_base=$(ssh "${ssh_options[@]}" root@110.40.138.167 "git -C /opt/video-parser-admin rev-parse --verify HEAD 2>/dev/null || true")
          if [[ "$bundle_base" =~ ^[0-9a-fA-F]{40}$ ]]; then
            bundle_base="${bundle_base,,}"
          fi
          if [[ "$bundle_base" =~ ^[0-9a-f]{40}$ ]] &&
             git cat-file -e "${bundle_base}^{commit}" 2>/dev/null &&
             git merge-base --is-ancestor "$bundle_base" HEAD &&
             [ "$bundle_base" != "$(git rev-parse HEAD)" ]; then
            git bundle create deploy.bundle HEAD "^$bundle_base"
            echo "Created incremental Git bundle from server baseline"
          else
            git bundle create deploy.bundle HEAD
            echo "Created full Git bundle (no compatible earlier server baseline)"
          fi
          git bundle verify deploy.bundle
          # 首次部署时目标目录尚不存在，SCP 不会自动创建，先 ssh 建好
          ssh "${ssh_options[@]}" root@110.40.138.167 "mkdir -p /opt/video-parser-admin"
          scp "${ssh_options[@]}" deploy.bundle root@110.40.138.167:/opt/video-parser-admin/deploy.bundle

      - name: Deploy over SSH ( clone + build + run on 7861 )
        uses: appleboy/ssh-action@v1
        with:
          host: 110.40.138.167
          username: root
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e
            test -s /opt/video-parser/.env.admin || { echo "Admin runtime environment is missing"; exit 1; }
            curl -fsS http://127.0.0.1:7861/health >/dev/null || { echo "Running admin is unhealthy; refusing to replace it"; exit 1; }
            echo "==> [1/4] 导入提交到 /opt/video-parser-admin"
            mkdir -p /opt/video-parser-admin
            cd /opt/video-parser-admin
            if [ ! -d .git ]; then
              git init -q
              git config user.email "deploy@local"
              git config user.name "deploy"
              git remote add origin ./deploy.bundle || true
            fi
            git bundle verify ./deploy.bundle
            git fetch ./deploy.bundle HEAD
            git reset --hard FETCH_HEAD
            rm -f deploy.bundle

            bash ops/deploy-admin-container.sh
            echo "==> ADMIN DEPLOY DONE $(date)"
