name: Check public website

"on":
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public pages and authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          base="https://110.40.138.167"
          options=(--silent --show-error --retry 2 --retry-delay 5 --retry-all-errors --max-time 15)

          # Short-lived IP certificates need notice before browsers reject them.
          python3 - <<'PY'
          import datetime, socket, ssl, time
          host = "110.40.138.167"
          with socket.create_connection((host, 443), timeout=15) as connection:
              with ssl.create_default_context().wrap_socket(connection, server_hostname=host) as secured:
                  expires = ssl.cert_time_to_seconds(secured.getpeercert()["notAfter"])
          remaining = expires - time.time()
          print("HTTPS certificate expires:", datetime.datetime.fromtimestamp(expires, datetime.timezone.utc).isoformat())
          print(f"HTTPS certificate hours remaining: {remaining / 3600:.2f}")
          if remaining <= 24 * 3600:
              raise SystemExit("HTTPS certificate has at most 24 hours remaining; check renewal and proxy reload")
          PY

          curl "${options[@]}" --fail "$base/health" |
            python3 -c 'import json,sys; assert json.load(sys.stdin).get("status") == "healthy"'
          curl "${options[@]}" --fail "$base/admin/health" |
            python3 -c 'import json,sys; assert json.load(sys.stdin).get("ok") is True'

          expect_status() {
            expected="$1"
            url="$2"
            shift 2
            actual=$(curl "${options[@]}" --output /dev/null --write-out '%{http_code}' "$@" "$url")
            if [ "$actual" != "$expected" ]; then
              echo "Unexpected HTTP status for $url: expected $expected, got $actual" >&2
              exit 1
            fi
          }

          expect_status 200 "$base/"
          expect_status 200 "$base/sample-report"
          expect_status 200 "$base/admin/login"
          expect_status 302 "$base/account/files"
          expect_status 401 "$base/api/parse" -X POST -H 'Content-Type: application/json' --data '{"text":""}'
