<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}管理后台{% endblock %} · 视频解析工作台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='tabler.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='tabler-icons.min.css') }}">
</head>
<body>
  <div class="page">
    <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand navbar-brand-autodark" href="/">VA · 管理后台</a>
        <div class="collapse navbar-collapse" id="sidebar-menu">
          <ul class="navbar-nav pt-lg-3">
            <li class="nav-item">
              <a class="nav-link" href="/"><i class="ti ti-dashboard nav-link-icon"></i>运营看板</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/users"><i class="ti ti-users nav-link-icon"></i>账号使用情况</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/assets"><i class="ti ti-folder nav-link-icon"></i>资产记录库</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/logout"><i class="ti ti-logout nav-link-icon"></i>退出登录</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="http://110.40.138.167:7860/" target="_blank"><i class="ti ti-external-link nav-link-icon"></i>返回主站</a>
            </li>
          </ul>
        </div>
      </div>
    </aside>
    <div class="page-wrapper">
      <div class="page-header d-print-none">
        <div class="container-fluid d-flex justify-content-between align-items-center">
          <h2 class="page-title">{% block page_title %}管理后台{% endblock %}</h2>
          <div class="text-muted">管理员：<span class="badge bg-blue-lt">{{ user }}</span></div>
        </div>
      </div>
      <div class="page-body">
        <div class="container-fluid">
          {% block content %}{% endblock %}
        </div>
      </div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='tabler.min.js') }}"></script>
</body>
</html>
